services:
  tgestmilhas:
    build: .
    container_name: tgestmilhas
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - CRON_SECRET=${CRON_SECRET}
      - FREE_GROUP_URL=${FREE_GROUP_URL}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_INSTANCE=${EVOLUTION_INSTANCE}
      - WHATSAPP_GROUP_JID=${WHATSAPP_GROUP_JID}
    networks:
      - easypanel-curso

networks:
  easypanel-curso:
    external: true
    # Rede Docker (Swarm) do projeto "curso" no Easypanel — mesma onde
    # rodam curso_evolution-api, curso_n8n e curso_bancodedados.
