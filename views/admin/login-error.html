<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — Alerta de Milhas</title>
<style>
  :root { --bg:#0b1220; --card:#121b2e; --accent:#7fe08a; --text:#f2f5f9; --muted:#9aa7bd; --border:#263654; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); padding: 24px;
  }
  .card { background: var(--card); border-radius: 16px; max-width: 380px; width: 100%; padding: 32px 28px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
  h1 { font-size: 1.3rem; margin: 0 0 8px; }
  .error { color: #ff8a8a; font-size: 0.9rem; margin: 0 0 20px; }
  label { display: block; font-size: 0.85rem; margin: 14px 0 6px; color: var(--muted); }
  input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); background: #0d1626; color: var(--text); font-size: 1rem; }
  input:focus { outline: none; border-color: var(--accent); }
  button { width: 100%; margin-top: 22px; padding: 14px; border-radius: 10px; border: none; background: var(--accent); color: #05130a; font-size: 1rem; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <h1>Painel Admin — Alerta de Milhas</h1>
    <p class="error">Usuário ou senha incorretos.</p>
    <form method="POST" action="/admin/login">
      <label for="username">Usuário</label>
      <input type="text" id="username" name="username" required autofocus />
      <label for="password">Senha</label>
      <input type="password" id="password" name="password" required />
      <button type="submit">Entrar</button>
    </form>
  </div>
</body>
</html>
